[isort]
# Профиль, совместимый с black (форматирование импортов в стиле black)
profile = black

# Максимальная длина строки (88 — стандарт black, можно изменить на 120 или другое значение)
line_length = 88

# Формат вывода для многострочных импортов (3 — вертикальный с отступом, как в black)
multi_line_output = 3

# Добавлять запятую в конце последнего импорта в многострочных импортах
include_trailing_comma = True

# Не заставлять перенос на новую строку, если импорт короткий
force_grid_wrap = 0

# Использовать скобки для многострочных импортов (совместимо с black)
use_parentheses = True

# Локальные модули проекта (src считается firstparty)
known_first_party = src

# Сторонние библиотеки, используемые в проекте
known_third_party = pandas,requests

# Пропускать указанные файлы или директории (например, кэш или виртуальные окружения)
skip = .git,.mypy_cache,__pycache__,venv

# Пропускать файлы по шаблону (если нужно)
skip_glob = *.pyc,*.pyo

# Указывать порядок групп импортов (опционально, по умолчанию: STDLIB, THIRDPARTY, FIRSTPARTY)
sections = STDLIB,THIRDPARTY,FIRSTPARTY
