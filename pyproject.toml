[tool.poetry]
name = "bank-project"
version = "0.1.0"
description = "Bank project with 100% test coverage"
authors = ["Vladimir <skypromd@gmail.com>"]
readme = "README.md"
package-mode = false  # Исправлено: без кавычек, булево значение

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
black = "^24.8.0"
isort = "^5.13.2"
mypy = "^1.11.2"
pytest = "^8.3.3"
coverage = "^7.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | venv
)/
'''

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = "src"
known_third_party = "pandas,requests"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]
[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"
